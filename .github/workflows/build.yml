name: build
on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the upstream version is unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.c.outputs.build_needed }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-upstream.sh >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build_needed == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [term-sc, term-tc, term-j, term-k]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.check.outputs.version }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge jq unzip
          pip3 install --quiet fonttools

      - name: Build fonts
        run: bash scripts/build-fonts.sh "$VERSION" "$VARIANT"

      - name: Verify fonts
        run: for f in "dist/$VARIANT"/*.ttf "dist/$VARIANT"/*.ttc; do bash scripts/verify-fonts.sh "$f" "$VARIANT"; done

      - name: Package TTFs
        run: |
          source config.sh
          select_variant "$VARIANT"
          (cd "dist/$VARIANT" && zip -q "${FILE_STEM}-TTF.zip" "${FILE_STEM}-"*.ttf)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: font-${{ matrix.variant }}
          path: |
            dist/${{ matrix.variant }}/*.ttc
            dist/${{ matrix.variant }}/*-TTF.zip
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.check.outputs.build_needed == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        run: |
          assets=(dist/*.ttc dist/*-TTF.zip)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "${assets[@]}" --clobber
          else
            gh release create "$VERSION" "${assets[@]}" \
              --title "$VERSION" --notes "Auto-built from be5invis/Sarasa-Gothic $VERSION"
          fi

      - name: Update casks
        run: |
          source config.sh
          for variant in "${VARIANTS[@]}"; do
            select_variant "$variant"
            SHA=$(shasum -a 256 "dist/$TTC_NAME" | awk '{print $1}')
            URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${TTC_NAME}"
            bash scripts/update-cask.sh "$variant" "$VERSION" "$SHA" "$URL"
          done

      - name: Commit cask + version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/*.rb version.txt
          git commit -m "release: ${VERSION}" && git push || echo "nothing to commit"
